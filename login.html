<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in | SAT Ustoz</title>
<meta name="description" content="Sign in to SAT Ustoz with your Google account to save your SAT practice on every device.">
<link rel="canonical" href="https://satustoz.academy/login.html">
<meta name="theme-color" content="#2D5038">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sh.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .login-main { flex: 1; display: flex; align-items: center; padding: 36px 0 48px; }
  .login-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 0; border-radius: var(--r-float); overflow: hidden; border: 1px solid var(--line-2); background: var(--paper); width: 100%; }
  .login-side { background: var(--brand); color: #D6E2D0; padding: 44px 42px; position: relative; overflow: hidden; }
  .login-side :focus-visible { outline-color: var(--gold-on-dark); }
  .login-side::after { content: ''; position: absolute; right: -150px; bottom: -150px; width: 260px; height: 260px; border-radius: 64px; border: 2px solid rgba(212,179,113,.5); }
  .login-side::before { content: ''; position: absolute; right: -90px; bottom: -90px; width: 160px; height: 160px; border-radius: 40px; border: 2px solid rgba(212,179,113,.32); }
  .login-side .kicker { color: #EDD9A8; }
  .login-side h1 { color: #fff; font-size: clamp(1.8rem, 3.6vw, 2.5rem); }
  .perks { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 16px; position: relative; z-index: 1; }
  .perks li { display: flex; gap: 12px; align-items: flex-start; color: #D6E2D0; }
  .perks li svg { flex: 0 0 auto; width: 22px; height: 22px; margin-top: 2px; }
  .login-card { padding: 44px 40px; min-width: 0; }
  .login-side { min-width: 0; }
  .login-card h2 { font-size: 1.7rem; }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 52px; border-radius: var(--r-sm); border: 1px solid #747775; background: #fff; color: #1F1F1F; font-family: Roboto, var(--sans); font-weight: 600; font-size: 1.02rem; cursor: pointer; padding: 0 20px; transition: background-color .15s, box-shadow .15s, transform .15s; }
  .gbtn:hover { background: #F7F8F8; box-shadow: 0 1px 3px rgba(60,64,67,.3); }
  .gbtn:active { transform: none; }
  .gbtn[disabled] { opacity: .6; cursor: wait; }
  .gbtn svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .fine { font-size: .86rem; color: var(--muted); margin-top: 18px; }
  .skip { display: block; text-align: center; margin-top: 10px; padding: 10px 0; font-weight: 600; }
  .msg { margin-top: 16px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #dadce0; border-top-color: var(--brand); animation: spin 1s linear infinite; }
  .who { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); margin: 18px 0; background: var(--ivory); }
  .who img, .who .ini { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: 0 0 auto; }
  .who b, .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who span { color: var(--muted); font-size: .92rem; }
  .who > div { min-width: 0; }
  .ia-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 60px; font-size: 1.12rem; }
  .ia-btn svg { width: 24px; height: 24px; flex: 0 0 auto; }
  .ia-steps { margin: 4px 0 18px; padding: 0; list-style: none; counter-reset: ia; display: grid; gap: 10px; }
  .ia-steps li { counter-increment: ia; display: flex; gap: 12px; align-items: flex-start; }
  .ia-steps li::before { content: counter(ia); flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .92rem; }
  .ia-steps b { color: var(--ink); }
  .ia-link { width: 100%; margin-top: 10px; font-size: .9rem; color: var(--muted); }
  .ia-or { font-size: .92rem; color: var(--muted); margin: 16px 0 8px; }
  @media (max-width: 860px) {
    .login-grid { grid-template-columns: minmax(0, 1fr); max-width: 520px; margin: 0 auto; }
    .login-side { padding: 28px 24px; }
    .perks { margin-top: 16px; gap: 10px; }
    .login-card { padding: 28px 24px 32px; }
  }
  @media (max-width: 480px) {
    .login-main { padding: 16px 0 28px; }
    .login-side h1 { font-size: 1.6rem; }
    .perks li:nth-child(n+3) { display: none; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><picture><source media="(max-width: 359px)" srcset="assets/brand/mark.svg"><img class="brand-logo" src="assets/brand/logo-horizontal.svg" alt="SAT Ustoz" width="171" height="40"></picture></a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="uz" aria-pressed="false">UZ</button><button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
</header>

<main class="login-main" id="main" tabindex="-1">
  <div class="wrap">
    <div class="login-grid">
      <section class="login-side">
        <span class="kicker">SAT Ustoz</span>
        <h1 data-t="side_h">Your SAT practice, saved everywhere.</h1>
        <ul class="perks">
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#C8A86E" stroke-width="2.4"/></svg><span data-t="b1">Pick up on your laptop where you stopped on your phone.</span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#C8A86E" stroke-width="2.4"/></svg><span data-t="b2">Keep every practice test score and see your progress by skill.</span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#C8A86E" stroke-width="2.4"/></svg><span data-t="b3">Use the AI tutor on any question.</span></li>
        </ul>
      </section>
      <section class="login-card" id="card" aria-live="polite">
        <div class="row" style="gap:12px"><div class="spin" aria-hidden="true"></div><span class="muted">&hellip;</span></div>
      </section>
    </div>
  </div>
</main>

<script src="assets/sh.js" data-analytics defer></script>

  const T = {

      g_choose: 'Choose…', g_8: '8 or below', g_grad: 'Finished school', g_uni: 'University', t_unsure: 'Not sure yet',

      card_h: 'Kiring yoki roʻyxatdan oʻting', card_p: 'Google hisobingiz bilan bir bosishda. Parol eslab qolish shart emas.',
      google: 'Google orqali davom etish', apple: 'Apple orqali davom etish', working: 'Google kutilmoqda…', f_region: 'Viloyat (milliy imtihon reytingi uchun)',
      privacy: 'Ismingiz va emailingizdan faqat hisob yaratish va natijalaringizni saqlash uchun foydalanamiz. Hech narsa joylamaymiz va xatlaringizni oʻqimaymiz. 18 yoshga toʻlmagan boʻlsangiz, avval ota-onangiz bilan maslahatlashing.',

      copy: 'Havolani nusxalash', copied: 'Havola nusxalandi. Uni Chrome yoki Safari’ga qoʻying.',

      card_h: 'Войдите или зарегистрируйтесь', card_p: 'Один клик через аккаунт Google. Никаких паролей.',
      google: 'Продолжить с Google', apple: 'Продолжить с Apple', working: 'Ждём Google…', f_region: 'Регион (для рейтинга национального экзамена)',
      privacy: 'Мы используем ваше имя и email только для создания аккаунта и сохранения прогресса. Мы ничего не публикуем и не читаем вашу почту. Если вам нет 18, сначала посоветуйтесь с родителями.',
      skip: 'Продолжить без аккаунта',
      ia_h: 'Откройте SAT Ustoz в браузере', ia_p: 'Внутри {app} вход через Google не работает. Чтобы войти, откройте страницу в {browser}.', this_app: 'этого приложения',
      ia_chrome: 'Открыть в Chrome', ia_safari_btn: 'Скопировать ссылку для Safari',
      ia_s1: 'Нажмите <b>⋯</b> в правом верхнем углу экрана.', ia_s2: 'Выберите <b>«Открыть в Safari»</b> (в Instagram: <b>«Open in external browser»</b>).', ia_s3: 'Войдите там через Google. Прогресс сохранится в вашем аккаунте.',
      ia_or: 'Не открылось? Скопируйте ссылку и вставьте её в Chrome или Safari.', ia_try: 'Всё равно попробовать войти через Google здесь',
      copy: 'Скопировать ссылку', copied: 'Ссылка скопирована. Вставьте её в Chrome или Safari.',

      g_choose: 'Выберите…', g_8: '8 класс или младше', g_grad: 'Окончил(а) школу', g_uni: 'Университет', t_unsure: 'Пока не знаю',
      save: 'Сохранить и начать', need_name: 'Пожалуйста, введите имя.',
      signed_h: 'Вы вошли в аккаунт', signed_p: 'Ваш прогресс сохраняется в этом аккаунте.', cont: 'Продолжить', not_you: 'Не вы? Выйти',
      back: 'Вернуться на сайт'
    }
  };
  let lang = SH.pickLang(); // Uzbek first for students in Uzbekistan
  const t = (k, vars) => { let s = (T[lang] && T[lang][k]) || T.en[k] || k; Object.keys(vars || {}).forEach(v => { s = s.split('{' + v + '}').join(vars[v]); }); return s; };

  const params = new URLSearchParams(location.search);
  const next = SH.safeNext(params.get('next'));
  const card = $('#card');
  let state = 'loading', errorMsg = '', busy = false, forceGoogle = false;
  // Google blocks sign-in inside app browsers (Telegram, Instagram...), so
  // those visitors get a way out to Chrome or Safari instead of the button.
  const ua = navigator.userAgent || '';
  const OS = /Android/i.test(ua) ? 'android' : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : '';
  // intent:// asks Android to open the same page in Chrome (or the Play Store if Chrome is missing).
  const chromeUrl = () => 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end';

  const G_LOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';

  const APPLE_LOGO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.3-.1 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-4.2zM13.9 4.9c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>';
  function applyStatic() {
    document.documentElement.lang = lang;
    $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  }
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; SH.store.set('lang', lang); applyStatic(); render(); }));

  function whoHtml(u, p) {
    const name = p.name || u.name || u.email;
    const ini = name.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
    return '<div class="who">' + (u.photo ? '<img src="' + esc(u.photo) + '" alt="" referrerpolicy="no-referrer">' : '<div class="ini">' + esc(ini) + '</div>') + '<div><b>' + esc(name) + '</b><span>' + esc(u.email) + '</span></div></div>';
  }

  function render() {
    const u = SH.auth.user, p = SH.getProfile();
    if (state === 'loading') return;
    if (!SH.auth.enabled() || SH.auth.failed) {
      card.innerHTML = '<h2>' + esc(t('card_h')) + '</h2><p class="muted">' + esc(t('off')) + '</p><a class="btn btn-primary" href="' + esc(next) + '">' + esc(t('go_practice')) + '</a>';
      return;
    }
    if (!u) {
      const app = SH.inAppBrowser();
      if (app && !forceGoogle) { renderInApp(app); return; }
      card.innerHTML = '<h2>' + esc(t('card_h')) + '</h2><p class="muted">' + esc(t('card_p')) + '</p>' +
        '<button type="button" class="gbtn" id="google"' + (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spin" aria-hidden="true"></span>' + esc(t('working')) : G_LOGO + esc(t('google'))) + '</button>' +

        '<p class="fine">' + esc(t('privacy')) + '</p>' +
        (SH.CONFIG.REQUIRE_LOGIN ? '' : '<a class="skip" href="' + esc(next) + '">' + esc(t('skip')) + '</a>');
      $('#google').addEventListener('click', () => signIn('google'));
      const ap = $('#apple'); if (ap) ap.addEventListener('click', () => signIn('apple'));
      return;
    }
    if (!p.onboarded) {
      const first = (p.name || u.name || '').split(' ')[0] || '';
      const grades = [['', t('g_choose')], ['8', t('g_8')], ['9', '9'], ['10', '10'], ['11', '11'], ['12', '12'], ['graduated', t('g_grad')], ['university', t('g_uni')]];
      const targets = [['', t('t_unsure')]];
      for (let s = 1600; s >= 1000; s -= 50) targets.push([String(s), String(s)]);
      const curTarget = p.target && p.target !== 1400 ? String(p.target) : '';
      card.innerHTML = '<h2>' + esc(t('welcome_h', { name: first || '' })).replace(', !', '!') + '</h2><p class="muted">' + esc(t('onb_p')) + '</p>' + whoHtml(u, p) +
        '<form id="onb" novalidate>' +
        '<div class="field"><label for="o-name">' + esc(t('f_name')) + '</label><input class="input" id="o-name" maxlength="60" autocomplete="name" value="' + esc(p.name || u.name) + '" required></div>' +
        '<div class="row"><div class="grow field"><label for="o-grade">' + esc(t('f_grade')) + '</label><select class="input" id="o-grade">' + grades.map(g => '<option value="' + g[0] + '"' + (p.grade === g[0] ? ' selected' : '') + '>' + esc(g[1]) + '</option>').join('') + '</select></div>' +
        '<div class="grow field"><label for="o-target">' + esc(t('f_target')) + '</label><select class="input" id="o-target">' + targets.map(g => '<option value="' + g[0] + '"' + (curTarget === g[0] ? ' selected' : '') + '>' + esc(g[1]) + '</option>').join('') + '</select></div></div>' +
        '<div class="field"><label for="o-date">' + esc(t('f_date')) + '</label><input class="input" id="o-date" type="date" value="' + esc(p.testDate || '') + '"></div>' +
        '<div class="field"><label for="o-region">' + esc(t('f_region')) + '</label><select class="input" id="o-region"><option value="">' + esc(t('g_choose')) + '</option>' + SH.REGIONS.map(r => '<option' + (p.region === r ? ' selected' : '') + '>' + esc(r) + '</option>').join('') + '</select></div>' +
        '<div id="o-err"></div><button class="btn btn-primary btn-block" type="submit">' + esc(t('save')) + '</button></form>';
      $('#onb').addEventListener('submit', async e => {
        e.preventDefault();
        const name = $('#o-name').value.trim();
        if (!name) { $('#o-err').innerHTML = '<div class="notice notice-bad" style="margin-bottom:12px">' + esc(t('need_name')) + '</div>'; $('#o-name').focus(); return; }
        const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
        SH.setProfile({ name, grade: $('#o-grade').value, target: +$('#o-target').value || 1400, testDate: $('#o-date').value, region: $('#o-region').value, onboarded: true });
        await SH.sync.flush();
        location.href = next;
      });
      setTimeout(() => { const n = $('#o-name'); if (n && !n.value) n.focus(); }, 50);
      return;
    }
    card.innerHTML = '<h2>' + esc(t('signed_h')) + '</h2><p class="muted">' + esc(t('signed_p')) + '</p>' + whoHtml(u, p) +
      '<a class="btn btn-primary btn-block" href="' + esc(next) + '">' + esc(t('cont')) + '</a>' +
      '<button type="button" class="link-btn skip" id="out" style="width:100%">' + esc(t('not_you')) + '</button>';
    $('#out').addEventListener('click', async () => { await SH.auth.signOut(); errorMsg = ''; render(); });
  }

  function renderInApp(app) {
    const appName = app === 'app' ? t('this_app') : app;
    const ios = OS === 'ios', android = OS === 'android';
    const ICON_OUT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const ICON_COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
    card.innerHTML = '<h2>' + esc(t('ia_h')) + '</h2><p class="muted">' + esc(t('ia_p', { app: appName, browser: android ? 'Chrome' : ios ? 'Safari' : 'Chrome / Safari' })) + '</p>' +
      (android
        ? '<a class="btn btn-primary ia-btn" id="ia-open" href="' + esc(chromeUrl()) + '">' + ICON_OUT + esc(t('ia_chrome')) + '</a>' +
          '<p class="ia-or">' + esc(t('ia_or')) + '</p><button type="button" class="btn btn-ghost btn-block" data-copy>' + esc(t('copy')) + '</button>'
        : '<ol class="ia-steps"><li><span>' + t('ia_s1') + '</span></li><li><span>' + t('ia_s2') + '</span></li><li><span>' + esc(t('ia_s3')) + '</span></li></ol>' +
          '<button type="button" class="btn btn-primary ia-btn" data-copy>' + ICON_COPY + esc(t(ios ? 'ia_safari_btn' : 'copy')) + '</button>') +
      '<input class="input ia-link" readonly aria-label="' + esc(t('copy')) + '" value="' + esc(location.href) + '">' +
      (SH.CONFIG.REQUIRE_LOGIN ? '' : '<a class="skip" href="' + esc(next) + '">' + esc(t('skip')) + '</a>') +
      '<button type="button" class="link-btn skip" id="ia-try" style="width:100%;font-weight:400;font-size:.9rem">' + esc(t('ia_try')) + '</button>';
    $('[data-copy]').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); SH.toast(t('copied')); }
      catch (e) { const f = $('.ia-link'); f.focus(); f.select(); prompt(t('copy'), location.href); }
    });
    $('.ia-link').addEventListener('focus', e => e.target.select());
    $('#ia-try').addEventListener('click', () => { forceGoogle = true; render(); });
  }

  async function signIn(how) {
    if (busy) return;
    busy = true; errorMsg = ''; render();
    try {
      await (how === 'apple' ? SH.auth.signInWithApple() : SH.auth.signInWithGoogle());
      busy = false;
      if (SH.getProfile().onboarded) { location.href = next; return; }
      render();
    } catch (e) {
      busy = false; errorMsg = e.message || ''; render();
    }
  }

  applyStatic();
  if (SH.auth.enabled()) await SH.auth.ready();
  state = 'ready';
  render();
});
</script>
</body>
</html>
