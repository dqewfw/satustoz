  /* ---------------- Finish & scoring ---------------- */
  function sectionScore(s, routes, responses) {
    const route = routes[s.id];
    const m1 = s.module1.questions, m2 = s.module2[route].questions;
    const c1 = m1.filter(q => SH.isCorrect(q, responses[q.id])).length;
    const c2 = m2.filter(q => SH.isCorrect(q, responses[q.id])).length;
    const w = route === 'harder' ? test.scoring.m2HardWeight : test.scoring.m2EasyWeight;
    const frac = (c1 + w * c2) / (m1.length + test.scoring.m2HardWeight * m2.length);
    return { score: Math.max(200, Math.min(800, Math.round((200 + 600 * frac) / 10) * 10)), route, c1, n1: m1.length, c2, n2: m2.length };
  }
  function finish() {
    stopTick();
    const taken = takenQuestions(S.routes);
    const responses = {};
    taken.forEach(t => { if (S.responses[t.q.id] != null) responses[t.q.id] = S.responses[t.q.id]; });
    const rec = {
      id: SH.uid('t'), testId, title: test.title, name: S.name, startedAt: S.startedAt, finishedAt: Date.now(),
      routes: S.routes, responses, marked: S.marked, time: S.time, moduleLog: S.moduleLog, sections: {}
    };
    let total = 0;
    test.sections.forEach(s => { const r = sectionScore(s, S.routes, responses); rec.sections[s.id] = r; total += r.score; });
    rec.total = test.sections.length === 2 ? total : null;
    SH.recordAttempts(taken.map(t => ({
      qid: t.q.id, section: t.q.section, domain: t.q.domain, skill: t.q.skill, difficulty: t.q.difficulty,
      correct: SH.isCorrect(t.q, responses[t.q.id]), ms: S.time[t.q.id] || 0, source: 'test'
    })));
    // Every wrong or blank answer goes into the mistake notebook (Pro sees test mistakes there).
    SH.mistakes.recordMany(taken.map(t => ({ q: t.q, ok: SH.isCorrect(t.q, responses[t.q.id]), src: { type: 'test', id: testId, where: test.title } })));
    if (S.mock) rec.mock = S.mock.id;
    SH.addTestHistory(rec);
    SH.track('test_finished', { test_id: testId, test_plan: test.plan, total: rec.total, rw: rec.sections.rw ? rec.sections.rw.score : null, math: rec.sections.math ? rec.sections.math.score : null, minutes: Math.round((rec.finishedAt - rec.startedAt) / 60000) });
    const right = taken.filter(t => SH.isCorrect(t.q, responses[t.q.id])).length;
    SH.classes.submit({ kind: 'test', ref: testId }, { title: test.title, score: rec.total, rw: rec.sections.rw ? rec.sections.rw.score : null, math: rec.sections.math ? rec.sections.math.score : null, correct: right, count: taken.length })
      .catch(e => console.warn('[SAT Ustoz] Could not send the result to your teacher:', e));
    if (testId === 'diagnostic-mini') SH.referral.complete(testId);
    if (S.mock && rec.total != null) {
      const m = { id: S.mock.id };
      SH.mock.submit(m, rec, S.mock.show).then(() => { rec.mockSaved = true; const el = $('#mock-res'); if (el) el.innerHTML = mockResHtml(rec, true); })
        .catch(e => { console.warn('[SAT Ustoz] Could not save the mock result:', e); const el = $('#mock-res'); if (el) el.innerHTML = mockResHtml(rec, false); });
    }
    SH.store.del(RUN_KEY);
    S = null;
    try { history.replaceState(null, '', 'test.html?id=' + encodeURIComponent(testId) + '&review=' + encodeURIComponent(rec.id)); } catch (e) { /* ignore */ }
    showResults(rec);
  }

  /* ---------------- Results ---------------- */
  function showResults(rec) {
    stopTick(); closePanels();
    function keep(t, filter) {
      const r = rec.responses[t.q.id]; const ok = SH.isCorrect(t.q, r);
      if (filter === 'wrong') return !ok;
      if (filter === 'marked') return !!(rec.marked && rec.marked[t.q.id]);
      if (filter === 'blank') return r == null || r === '';
      return true;
    }
    const filterCount = f => takenQuestions(rec.routes).filter(t => keep(t, f)).length;
    document.body.classList.add('results');
    const taken = takenQuestions(rec.routes);
    const fmtMin = ms => SH.fmtClock((ms || 0) / 1000);
    const fmtSec = ms => ms ? Math.round(ms / 1000) + 's' : '';
    const secRows = test.sections.map(s => {
      const r = rec.sections[s.id] || sectionScore(s, rec.routes, rec.responses);
      return '<div class="sec-score"><div class="sec-row"><div><div class="small muted">' + esc(s.title) + '</div><div class="small">Module 2: <b>' + (r.route === 'harder' ? 'harder' : 'easier') + '</b></div></div><span class="sec-num">' + r.score + '</span></div>' +
        '<div class="bar" aria-hidden="true"><i style="width:' + Math.round((r.score - 200) / 6) + '%"></i></div></div>';
    }).join('');
    const modRows = (rec.moduleLog || []).map(m => {
      const s = test.sections.find(x => x.id === m.sec);
      return '<tr><td>' + esc(s ? s.title : m.sec) + ', Module ' + (m.mod + 1) + (m.route ? ' <span class="small muted">(' + m.route + ')</span>' : '') + '</td><td>' + m.correct + ' / ' + m.n + '</td><td>' + fmtMin(m.usedMs) + '</td></tr>';
    }).join('');
    const doms = {};
    taken.forEach(t => {
      const k = t.q.section + '|' + (t.q.domain || 'Other');
      if (!doms[k]) doms[k] = { sec: t.q.section, name: t.q.domain || 'Other', c: 0, n: 0 };
      doms[k].n++; if (SH.isCorrect(t.q, rec.responses[t.q.id])) doms[k].c++;
    });
    const domRows = Object.values(doms).map(d => '<div class="dom-row"><div><span class="tag tag-' + d.sec + '">' + (d.sec === 'rw' ? 'R&amp;W' : 'Math') + '</span> ' + esc(d.name) + '</div><div class="bar"><i style="width:' + SH.pct(d.c, d.n) + '%"></i></div><div><b>' + d.c + '/' + d.n + '</b></div></div>').join('');
    // Free: the score only. The three weakest skills show blurred, and the
    // question review is a preview; both open the Pro sheet. Tests finished
    // before Free changed keep their full results (SH.plan.insights).
    const full = SH.plan.insights(rec);
    const skills = {};
    taken.forEach(t => {
      const k = t.q.section + '|' + (t.q.skill || t.q.domain || 'Other');
      if (!skills[k]) skills[k] = { sec: t.q.section, name: t.q.skill || t.q.domain || 'Other', c: 0, n: 0 };
      skills[k].n++; if (SH.isCorrect(t.q, rec.responses[t.q.id])) skills[k].c++;
    });
    const weakest = Object.values(skills).filter(s => s.n >= 2).sort((a, b) => a.c / a.n - b.c / b.n || b.n - a.n).slice(0, 3);
    const weakRows = weakest.map(d => '<div class="dom-row"><div><span class="tag tag-' + d.sec + '">' + (d.sec === 'rw' ? 'R&amp;W' : 'Math') + '</span> ' + esc(d.name) + '</div><div class="bar"><i style="width:' + SH.pct(d.c, d.n) + '%"></i></div><div><b>' + d.c + '/' + d.n + '</b></div></div>').join('');
    const wrongCount = filterCount('wrong');
    const isDiag = rec.testId === 'diagnostic-mini';

    app.className = '';
    app.innerHTML =
      '<header class="res-top"><div class="wrap"><a class="brand" href="index.html"><picture><source media="(max-width: 359px)" srcset="assets/brand/mark.svg"><img class="brand-logo" src="assets/brand/logo-horizontal.svg" alt="SAT Ustoz" width="171" height="40"></picture></a><a class="btn btn-ghost btn-sm" href="practice.html#tests">Back to practice</a></div></header>' +
      '<main class="wrap res" id="tr-main">' +
      '<section class="card score-hero"><div><span class="kicker">Your results</span><h1 style="font-size:clamp(1.6rem,4vw,2.2rem)">' + esc(rec.title) + '</h1>' +
      '<p class="muted small">' + (rec.name ? esc(rec.name) + ', ' : '') + SH.fmtDate(rec.finishedAt) + '</p>' +
      (rec.total != null ? '<div class="score-big">' + rec.total + '<small>Estimated total score (400–1600)</small></div>' + scaleHtml(rec.total) : '') +
      '</div><div class="sec-scores">' + secRows + '<p class="small muted" style="margin:0">This is an estimate. The real SAT scores each question with item response theory, so treat it as a ballpark, not a prediction.</p></div></section>' +
      '<div class="row" style="margin:16px 0 26px"><a class="btn btn-primary" href="test.html?id=' + encodeURIComponent(rec.testId) + '">Retake this test</a><a class="btn btn-ghost" href="practice.html#home">Practice my weak skills</a><button type="button" class="btn btn-ghost" id="share-score">Share my score</button></div>' +
      (rec.mock ? '<section class="card notice-ok" id="mock-res" style="margin-bottom:26px">' + mockResHtml(rec, rec.mockSaved ? true : null) + '</section>' : '') +
      (isDiag ? '<section class="card diag" id="diag" style="margin-bottom:26px"></section>' : '') +
      (full
        ? '<div class="grid grid-2"><section class="card"><h3>Modules</h3><table class="mod-table"><thead><tr><th>Module</th><th>Correct</th><th>Time used</th></tr></thead><tbody>' + modRows + '</tbody></table></section>' +
          '<section class="card"><h3>By content domain</h3>' + domRows + '</section></div>'
        : isDiag ? '' : '<section class="card"><h3>Your three weakest skills</h3>' + SH.lockBox(weakRows || domRows, 'See which skills cost you points', 'Pro breaks your score down by skill and module, so you know exactly what to practice next.', 'weak_skills') + '</section>') +
      (full ? '' : '<section style="margin-top:26px"><h2 style="font-size:1.6rem">Review every question</h2><div class="card">' +
        SH.lockBox('<div id="qprev"></div>', 'Review all ' + taken.length + ' questions', 'You missed ' + wrongCount + '. Pro shows each one with the right answer and an explanation.', 'review') + '</div></section>') +
      (!full ? '' : '<section style="margin-top:26px"><h2 style="font-size:1.6rem">Review every question</h2>' +
      '<div class="filters" role="group" aria-label="Filter questions">' + [['all', 'All'], ['wrong', 'Incorrect'], ['marked', 'Marked'], ['blank', 'Unanswered']].map((f, i) =>
        '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (i === 0) + '">' + f[1] + '<span class="cnt">' + filterCount(f[0]) + '</span></button>').join('') + '</div>' +
      '<div id="qlist"></div></section>') + '</main>';

    // Story-sized score card (1080x1920) for Instagram and Telegram stories.
    // The image is ready before the Share button shows, so the tap that
    // shares is still the student's own (browsers require that).
    async function shareImage() {
      const secs = test.sections.map(s => ({ title: s.title, score: (rec.sections[s.id] || sectionScore(s, rec.routes, rec.responses)).score }));
      const score = rec.total != null ? rec.total : secs.reduce((n, s) => n + s.score, 0);
      const outOf = rec.total != null ? 1600 : 800 * secs.length;
      const svg = async (path, h) => {
        const txt = (await (await fetch(path)).text()).replace('<svg ', '<svg height="' + h + '" ');
        const img = new Image();
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(txt);
        await img.decode();
        return img;
      };
      const [logo] = await Promise.all([svg('assets/brand/logo-full.svg', 400),
        document.fonts ? Promise.all(['600 300px Jost', '600 48px "Source Sans 3"', '400 40px "Source Sans 3"'].map(f => document.fonts.load(f))).catch(() => {}) : null]);
      const W = 1080, H = 1920, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      const DISPLAY = 'Jost, "Source Sans 3", sans-serif', SANS = '"Source Sans 3", Arial, sans-serif';
      const rrect = (l, t, w, h, r) => { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); };
      const fit = (text, font, size, max) => { do { x.font = font.replace('{s}', size); size -= 2; } while (x.measureText(text).width > max && size > 20); };
      x.fillStyle = '#F5F7F2'; x.fillRect(0, 0, W, H);
      const lh = 400, lw = lh * logo.width / logo.height;
      x.drawImage(logo, (W - lw) / 2, 230, lw, lh);
      x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      x.fillStyle = '#5E6A60'; x.font = '600 48px ' + SANS;
      x.fillText('My SAT practice score', W / 2, 760);
      x.fillStyle = '#2D5038'; fit(String(score), '600 {s}px ' + DISPLAY, 300, W - 160);
      x.fillText(String(score), W / 2, 1040);
      x.fillStyle = '#5E6A60'; x.font = '400 44px ' + SANS;
      x.fillText('out of ' + outOf, W / 2, 1110);
      // Section scores
      const boxT = 1170, boxH = 170, boxL = 90, boxW = W - 180;
      rrect(boxL, boxT, boxW, boxH, 28); x.fillStyle = '#FFFFFF'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#DFE5D9'; x.stroke();
      secs.forEach((s, i) => {
        const cx = boxL + boxW * (i + .5) / secs.length;
        if (i) { x.fillStyle = '#DFE5D9'; x.fillRect(boxL + boxW * i / secs.length - 1.5, boxT + 30, 3, boxH - 60); }
        x.fillStyle = '#2D5038'; x.font = '600 80px ' + DISPLAY; x.fillText(String(s.score), cx, boxT + 95);
        x.fillStyle = '#5E6A60'; fit(s.title, '600 {s}px ' + SANS, 34, boxW / secs.length - 40); x.fillText(s.title, cx, boxT + 140);
      });
      x.fillStyle = '#1D2A20'; fit(rec.title, '600 {s}px ' + SANS, 46, W - 180);
      x.fillText(rec.title, W / 2, 1420);
      // Brand band, kept above the bottom of the story where the reply bar sits
      x.fillStyle = '#2D5038'; x.fillRect(0, 1500, W, H - 1500);
      x.strokeStyle = 'rgba(200,168,110,.5)'; x.lineWidth = 4; rrect(W - 190, H - 250, 380, 380, 90); x.stroke();
      x.strokeStyle = 'rgba(200,168,110,.32)'; rrect(W - 110, H - 160, 240, 240, 58); x.stroke();
      x.fillStyle = '#D6E2D0'; x.font = '400 44px ' + SANS;
      x.fillText('Free adaptive SAT practice tests', W / 2, 1610);
      x.fillStyle = '#C8A86E'; x.font = '600 84px ' + DISPLAY;
      x.fillText('satustoz.academy', W / 2, 1715);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      return { blob, score, url: URL.createObjectURL(blob) };
    }
    async function openShare() {
      const btn = $('#share-score');
      btn.disabled = true;
      let img;
      try { img = await shareImage(); }
      catch (e) { SH.toast('Could not make the image. ' + (e.message || '')); return; }
      finally { btn.disabled = false; }
      const name = 'sat-ustoz-score-' + img.score + '.png';
      const file = typeof File === 'function' ? new File([img.blob], name, { type: 'image/png' }) : null;
      const canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
      const save = () => { const a = document.createElement('a'); a.href = img.url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
      const actions = [{ label: 'Close', kind: 'ghost' }, { label: 'Save image', kind: canShare ? 'ghost' : 'primary', onClick: () => { save(); return false; } }];
      if (canShare) actions.push({ label: 'Share', kind: 'primary', onClick: () => {
        navigator.share({ files: [file], text: 'My SAT practice score: ' + img.score + '. Practice free at https://satustoz.academy' })
          .catch(e => { if (e && e.name !== 'AbortError') save(); });
        return false;
      } });
      SH.modal({
        title: 'Share your score',
        html: '<img class="share-prev" src="' + img.url + '" alt="Your score card: ' + img.score + ', ' + esc(rec.title) + ', satustoz.academy" width="1080" height="1920">' +
          '<p class="small muted" style="margin:12px 0 0">Post it to your Instagram or Telegram story.' + (SH.inAppBrowser() ? ' If the buttons don’t work here, press and hold the image to save it.' : '') + '</p>',
        actions,
        onClose: () => setTimeout(() => URL.revokeObjectURL(img.url), 60000)
      });
    }

    $('#share-score').addEventListener('click', openShare);
    if (isDiag) drawDiagReport(rec, taken);
    const list = $('#qlist') || $('#qprev');
    function draw(filter) {
      const items = taken.filter(t => keep(t, filter));
      list.innerHTML = items.length ? items.map((t, i) => {
        const r = rec.responses[t.q.id]; const ok = SH.isCorrect(t.q, r); const blank = r == null || r === '';
        return '<div class="qitem" data-qid="' + esc(t.q.id) + '"><button type="button" aria-expanded="false">' +
          '<span class="res-ic ' + (ok ? 'ok' : blank ? 'skip' : 'no') + '" aria-label="' + (ok ? 'Correct' : blank ? 'Unanswered' : 'Incorrect') + '">' + (ok ? '✓' : blank ? '–' : '✕') + '</span>' +
          '<span class="qi-meta"><b>' + esc(t.sec.title) + ', module ' + (t.mod + 1) + ', question ' + t.n + '</b><br>' + esc(t.q.skill || t.q.domain || '') + (rec.marked && rec.marked[t.q.id] ? ' (marked)' : '') + '</span>' +
          '<span class="qi-ans">Yours <b>' + esc(blank ? '–' : r) + '</b>, answer <b>' + esc(SH.answerLabel(t.q)) + '</b><br>' + fmtSec(rec.time && rec.time[t.q.id]) + '</span>' +
          '</button></div>';
      }).join('') : '<p class="muted">Nothing here.</p>';
      $$('.qitem > button', list).forEach(b => b.addEventListener('click', () => {
        const item = b.parentElement;
        const open = b.getAttribute('aria-expanded') === 'true';
        const ex = item.querySelector('.qdetail');
        if (open) { if (ex) ex.remove(); b.setAttribute('aria-expanded', 'false'); return; }
        b.setAttribute('aria-expanded', 'true');
        const t = taken.find(x => x.q.id === item.dataset.qid);
        item.insertAdjacentHTML('beforeend', detailHtml(t.q, rec.responses[t.q.id]));
        const tb = item.querySelector('[data-tutor]');
        if (tb) tb.addEventListener('click', () => SH.openTutor({ question: t.q, response: rec.responses[t.q.id], correct: SH.isCorrect(t.q, rec.responses[t.q.id]) }));
      }));
    }
    if (!full) {
      // Preview only: a few rows, no answers, nothing to open.
      list.innerHTML = taken.slice(0, 4).map(t => '<div class="qitem"><button type="button" tabindex="-1"><span class="res-ic skip">?</span><span class="qi-meta"><b>' + esc(t.sec.title) + ', module ' + (t.mod + 1) + ', question ' + t.n + '</b><br>' + esc(t.q.skill || t.q.domain || '') + '</span><span class="qi-ans">Yours <b>?</b>, answer <b>?</b></span></button></div>').join('');
      window.scrollTo(0, 0);
      return;
    }
    draw('all');
    $$('[data-f]').forEach(b => b.addEventListener('click', () => {
      $$('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      draw(b.dataset.f);
    }));
    window.scrollTo(0, 0);
  }
  function mockResHtml(rec, ok) {
    const link = '<a class="btn btn-primary btn-sm" href="mock.html?id=' + encodeURIComponent(rec.mock) + '">See the leaderboard</a>';
    if (ok === true) return '<div class="row" style="justify-content:space-between"><span><b>National mock: your score is on the leaderboard.</b> Rankings by region and school update as students finish.</span>' + link + '</div>';
    if (ok === false) return '<p style="margin:0"><b>We could not put this score on the leaderboard.</b> Each mock counts once per student, and only while it is open. If that’s not the reason, message us on <a href="' + esc(SH.CONFIG.CONTACT_TELEGRAM) + '" target="_blank" rel="noopener">Telegram</a>.</p>';
    return '<p style="margin:0" aria-live="polite">Saving your score to the national leaderboard…</p>';
  }

  /* ---------------- Diagnostic report (free) ----------------
     The funnel after the mini diagnostic: the three skills that cost the most
     points, in the student's language, then Pro for those exact skills, then a
     free call or a trial lesson at the learning center. */
  const DIAG_T = SH.i18n({
    en: { h: 'Your diagnostic report', lead: 'Estimated score {s}. These three skills cost you the most points:', pts: 'about {n} points', missed: '{m} of {n} missed',
      pro_h: 'Practice exactly these skills', pro_p: 'Pro gives you drills for these skills, an explanation for every question you missed and a study plan to your test date.', pro_btn: 'See what Pro adds', drill_btn: 'Drill these skills',
      t_h: 'Want a teacher to go through it with you?', t_p: 'Book a free 15-minute call with Azizbek, or a free trial lesson at {c}.', t_btn: 'Book a free call',
      t_msg: 'Hi! I took the SAT Ustoz mini diagnostic and got {s}. My weakest skills: {k}. I would like a free 15-minute call or a trial lesson.',
      none: 'You missed almost nothing. Take a full practice test to find what to work on next.', est: 'Points are estimated with the same scoring that gives your score above.' },
    uz: { h: 'Diagnostika hisobotingiz', lead: 'Taxminiy ball: {s}. Eng koʻp ball yoʻqotgan uchta koʻnikmangiz:', pts: 'taxminan {n} ball', missed: '{n} tadan {m} tasi xato',
      pro_h: 'Aynan shu koʻnikmalarni mashq qiling', pro_p: 'Pro sizga shu koʻnikmalar boʻyicha mashqlar, xato qilgan har bir savolingizga izoh va imtihon sanangizgacha oʻqish rejasini beradi.', pro_btn: 'Pro nimalar berishini koʻrish', drill_btn: 'Shu koʻnikmalarni mashq qilish',
      t_h: 'Natijani oʻqituvchi bilan koʻrib chiqmoqchimisiz?', t_p: 'Azizbek bilan bepul 15 daqiqalik suhbatga yoki {c} markazida bepul sinov darsiga yoziling.', t_btn: 'Bepul suhbatga yozilish',
      t_msg: 'Salom! SAT Ustoz mini diagnostikasini topshirdim, natijam {s}. Eng zaif koʻnikmalarim: {k}. Bepul 15 daqiqalik suhbat yoki sinov darsiga yozilmoqchiman.',
      none: 'Deyarli xato qilmadingiz. Nimani mashq qilish kerakligini bilish uchun toʻliq sinov testini topshiring.', est: 'Ballar yuqoridagi natijangizni hisoblagan usul bilan taxminiy hisoblangan.' },
    ru: { h: 'Ваш отчёт по диагностике', lead: 'Примерный балл: {s}. Больше всего баллов вы потеряли на этих трёх навыках:', pts: 'около {n} баллов', missed: 'ошибок: {m} из {n}',
      pro_h: 'Тренируйте именно эти навыки', pro_p: 'Pro даёт тренировки по этим навыкам, объяснение к каждому вопросу с ошибкой и план подготовки до даты экзамена.', pro_btn: 'Что даёт Pro', drill_btn: 'Тренировать эти навыки',
      t_h: 'Хотите разобрать результат с преподавателем?', t_p: 'Запишитесь на бесплатный 15-минутный разговор с Азизбеком или на бесплатный пробный урок в {c}.', t_btn: 'Записаться бесплатно',
      t_msg: 'Здравствуйте! Я прошёл(ла) мини-диагностику SAT Ustoz, результат {s}. Самые слабые навыки: {k}. Хочу записаться на бесплатный 15-минутный разговор или пробный урок.',
      none: 'Вы почти не ошиблись. Пройдите полный пробный тест, чтобы понять, над чем работать.', est: 'Баллы оценены тем же способом, что и ваш результат выше.' }
  });
  // Points each skill cost, by the estimator in sectionScore(): a Module 1 miss
  // costs 600 / (n1 + hardWeight × n2), a Module 2 miss that times its route's weight.
  function lostBySkill(rec, taken) {
    const out = {};
    test.sections.forEach(s => {
      const route = rec.routes[s.id]; if (!route) return;
      const denom = s.module1.questions.length + test.scoring.m2HardWeight * s.module2[route].questions.length;
      const w = route === 'harder' ? test.scoring.m2HardWeight : test.scoring.m2EasyWeight;
      taken.filter(t => t.sec === s).forEach(t => {
        const k = s.id + '|' + (t.q.skill || 'Other');
        const o = out[k] = out[k] || { sec: s.id, skill: t.q.skill || 'Other', pts: 0, miss: 0, n: 0 };
        o.n++;
        if (!SH.isCorrect(t.q, rec.responses[t.q.id])) { o.miss++; o.pts += 600 * (t.mod === 0 ? 1 : w) / denom; }
      });
    });
    return Object.values(out).filter(o => o.miss).sort((a, b) => b.pts - a.pts).slice(0, 3);
  }
  function drawDiagReport(rec, taken) {
    const box = $('#diag'); if (!box) return;
    if (!SH.store.get('lang', null)) document.documentElement.lang = SH.pickLang();
    const top = lostBySkill(rec, taken);
    const pro = SH.plan.allows('pro');
    const score = rec.total != null ? rec.total : '–';
    const center = SH.CONFIG.LEARNING_CENTER || {};
    const msg = DIAG_T('t_msg', { s: score, k: top.map(o => o.skill).join(', ') || '-' });
    const callUrl = center.URL || (SH.CONFIG.CONTACT_TELEGRAM + '?text=' + encodeURIComponent(msg));
    const focus = top.length ? top.filter(o => o.sec === top[0].sec) : [];
    const drillUrl = focus.length ? 'practice.html?drill=' + btoa(unescape(encodeURIComponent(JSON.stringify({ s: focus[0].sec, d: '', n: 10, k: focus.map(o => o.skill), t: '', m: 'Diagnostic focus' })))).replace(/=+$/, '') : 'practice.html#sets';
    box.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="font-size:1.5rem;margin:0">' + esc(DIAG_T('h')) + '</h2>' +
      '<div class="lang-switch" role="group" aria-label="Language">' + ['en', 'uz', 'ru'].map(l => '<button type="button" data-dl="' + l + '" aria-pressed="' + (SH.langNow() === l) + '">' + l.toUpperCase() + '</button>').join('') + '</div></div>' +
      (top.length ? '<p>' + esc(DIAG_T('lead', { s: score })) + '</p>' + top.map(o => '<div class="diag-row"><div><span class="tag tag-' + o.sec + '">' + (o.sec === 'rw' ? 'R&amp;W' : 'Math') + '</span> <b>' + esc(o.skill) + '</b><div class="small muted">' + esc(DIAG_T('missed', { m: o.miss, n: o.n })) + '</div></div><b class="diag-pts">' + esc(DIAG_T('pts', { n: Math.max(10, Math.round(o.pts / 10) * 10) })) + '</b></div>').join('') +
        '<p class="small muted" style="margin:8px 0 0">' + esc(DIAG_T('est')) + '</p>' : '<p>' + esc(DIAG_T('none')) + '</p>') +
      '<div class="grid grid-2" style="margin-top:18px"><div class="card" style="background:var(--brand-tint);border-color:var(--brand-tint-2)"><h3>' + esc(DIAG_T('pro_h')) + '</h3><p class="small">' + esc(DIAG_T('pro_p')) + '</p>' +
      (pro ? '<a class="btn btn-primary btn-sm" href="' + esc(drillUrl) + '" data-diag="drill">' + esc(DIAG_T('drill_btn')) + '</a>' : '<button type="button" class="btn btn-primary btn-sm" data-diag="pro">' + esc(DIAG_T('pro_btn')) + '</button>') + '</div>' +
      '<div class="card"><h3>' + esc(DIAG_T('t_h')) + '</h3><p class="small">' + esc(DIAG_T('t_p', { c: center.NAME || 'our center' })) + '</p><a class="btn btn-ghost btn-sm" href="' + esc(callUrl) + '" target="_blank" rel="noopener" data-diag="call">' + esc(DIAG_T('t_btn')) + '</a></div></div>';
    $$('[data-dl]', box).forEach(b => b.addEventListener('click', () => { SH.store.set('lang', b.dataset.dl); document.documentElement.lang = b.dataset.dl; drawDiagReport(rec, taken); }));
    $$('[data-diag]', box).forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.diag;
      SH.track(k === 'call' ? 'consult_tapped' : 'diag_pro_tapped', { total: rec.total, action: k });
      if (k === 'pro') SH.plan.pitch({ title: DIAG_T('pro_h'), text: top.map(o => o.skill).join(', ') });
    }));
    if (!box.dataset.seen) { box.dataset.seen = '1'; SH.track('diag_report_viewed', { total: rec.total, skills: top.map(o => o.skill).join(', ') }); }
  }

  function scaleHtml(total) {
    const pos = v => Math.max(0, Math.min(100, (v - 400) / 12));
    const goal = +SH.getProfile().target || 0;
    return '<div class="scale" aria-hidden="true"><div class="scale-track"><div class="scale-fill" style="width:' + pos(total) + '%"></div>' +
      (goal >= 400 && goal <= 1600 ? '<div class="scale-goal" style="left:' + pos(goal) + '%" data-label="Goal ' + goal + '"></div>' : '') +
      '</div><div class="scale-labels"><span>400</span><span>1000</span><span>1600</span></div></div>';
  }
  function detailHtml(q, r) {
    let ans = '';
    if (q.type === 'mc') {
      ans = '<ul class="choices">' + q.choices.map((c, i) => {
        const L = SH.LETTERS[i];
        const cls = L === q.answer ? ' is-correct' : (L === r ? ' is-wrong' : '');
        return '<li class="choice-row"><div class="choice' + cls + '"><span class="letter">' + L + '</span><span class="choice-text rich">' + SH.renderRich(c, { inline: true }) + '</span></div></li>';
      }).join('') + '</ul>';
    } else {
      ans = '<p style="margin-top:12px">Your answer: <b>' + esc(r || '–') + '</b>. Accepted: <b>' + esc(q.answer.join(', ')) + '</b></p>';
    }
    return '<div class="qdetail">' + (q.passage || q.table || q.image ? '<div class="rich" style="margin-bottom:12px">' + SH.renderStimulus(q) + '</div>' : '') +
      '<div class="rich"><strong>' + SH.renderRich(q.prompt, { inline: true }) + '</strong></div>' + ans +
      (q.explanation ? '<div class="expl rich"><strong>Explanation.</strong> ' + SH.renderRich(q.explanation) + '</div>' : '') +
      (SH.ai.enabled() ? '<p style="margin:14px 0 0"><button type="button" class="btn btn-ghost btn-sm" data-tutor>Ask the AI tutor about this</button></p>' : '') +
      '<p class="report-line"><button type="button" class="link-btn" data-report data-qid="' + esc(q.id || '') + '" data-where="' + esc(test.title) + '">Report a mistake</button></p></div>';
  }

  window.addEventListener('beforeunload', () => { if (S) { leaveQuestion(); save(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (S) save(); SH.sync.flush(); } });
});
</script>
</body>
</html>
