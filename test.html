<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Test · Scholar's Hub</title>
<meta name="description" content="Full-length digital SAT practice in the two-module adaptive format, with timer, review page, calculator and reference sheet.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E1F2B">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/sh.css">
<style>
  html, body { height: 100%; }
  body.tr { background: #fff; overflow: hidden; }
  .tr-shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  /* Top bar */
  .tr-top { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 8px 20px; min-height: 66px; background: #fff; }
  .tr-left { min-width: 0; }
  .tr-title { font-weight: 700; font-size: 1.02rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-dir { background: none; border: 0; padding: 2px 0; font-weight: 600; font-size: .92rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
  .tr-dir:hover { color: var(--maroon); text-decoration: underline; }
  .tr-center { text-align: center; }
  .tr-timer { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
  .tr-timer.low { color: var(--bad); }
  .tr-timer.hidden-t { visibility: hidden; }
  .tr-hide { margin-top: 2px; border: 1px solid #8F857C; background: #fff; border-radius: 999px; padding: 1px 12px; font-size: .78rem; font-weight: 700; cursor: pointer; }
  .tr-hide:hover { border-color: var(--maroon); color: var(--maroon); }
  .tr-right { display: flex; justify-content: flex-end; gap: 4px; }
  .tool { background: none; border: 0; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; border-radius: 8px; font-size: .76rem; font-weight: 600; color: var(--ink-2); min-width: 56px; }
  .tool svg { width: 22px; height: 22px; }
  .tool:hover, .tool[aria-pressed="true"], .tool[aria-expanded="true"] { background: var(--maroon-tint); color: var(--maroon); }
  .tr-dash { flex: 0 0 auto; height: 3px; background: repeating-linear-gradient(90deg, var(--maroon) 0 16px, transparent 16px 22px, var(--gold) 22px 38px, transparent 38px 44px); }

  /* Main */
  .tr-main { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; background: #fff; }
  .tr-split { display: flex; height: 100%; }
  .tr-pane { overflow-y: auto; padding: 28px 34px 40px; }
  .tr-lpane { flex: 0 0 var(--split, 50%); max-width: calc(100% - 300px); min-width: 260px; }
  .tr-rpane { flex: 1 1 auto; min-width: 0; }
  .tr-divider { flex: 0 0 12px; position: relative; cursor: col-resize; background: #fff; touch-action: none; }
  .tr-divider::before { content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: #CFC6BA; }
  .tr-divider span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 40px; border-radius: 8px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .7rem; }
  .tr-divider:focus-visible span, .tr-divider:hover span { background: var(--maroon); }
  .tr-single { height: 100%; overflow-y: auto; }
  .tr-single-inner { max-width: 780px; margin: 0 auto; padding: 28px 24px 48px; }
  .passage { font-size: 1.06rem; line-height: 1.7; }
  .passage mark.hl { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; }
  .passage mark.hl.has-note { border-bottom: 2px solid var(--gold); }

  .qbar { display: flex; align-items: center; gap: 10px; background: #F1ECE4; border-bottom: 2px dashed #A79D91; margin-bottom: 18px; padding-right: 6px; }
  .qnum { background: var(--ink); color: #fff; font-weight: 700; min-width: 34px; height: 34px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; }
  .mark-btn { background: none; border: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .92rem; cursor: pointer; padding: 6px 4px; color: var(--ink-2); }
  .mark-btn svg { width: 16px; height: 18px; }
  .mark-btn[aria-pressed="true"] svg path { fill: var(--maroon); stroke: var(--maroon); }
  .mark-btn[aria-pressed="true"] { color: var(--maroon); }
  .abc-btn { margin-left: auto; background: #fff; border: 1.5px solid #8F857C; border-radius: 6px; font-weight: 700; font-size: .78rem; padding: 3px 7px; cursor: pointer; text-decoration: line-through; letter-spacing: .04em; }
  .abc-btn[aria-pressed="true"] { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .q-prompt { margin-bottom: 18px; font-size: 1.06rem; }
  .spr-dirs h3 { font-family: var(--sans); font-size: 1.1rem; font-weight: 700; }
  .spr-dirs ul { padding-left: 1.2em; margin: 0 0 1em; }
  .spr-dirs li { margin-bottom: .35em; }
  .spr-dirs table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  .spr-dirs th, .spr-dirs td { border: 1px solid #BDB2A4; padding: 6px 8px; text-align: left; vertical-align: top; }
  .spr-dirs th { background: #F3EEE6; }

  /* Bottom bar */
  .tr-bot { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 10px 20px calc(10px + var(--safe-b)); background: #fff; border-top: 2px dashed #A79D91; position: relative; }
  .tr-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
  .tr-navbtn { background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .tr-navbtn:hover { background: var(--maroon); }
  .tr-navbtn svg { width: 12px; height: 12px; transition: transform .15s; }
  .tr-navbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .tr-bot-r { display: flex; justify-content: flex-end; gap: 8px; }
  .tr-bot .btn { min-height: 40px; }

  /* Navigator popover */
  .navpop { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); padding: 18px 20px; z-index: 60; }
  .navpop::after { content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; width: 16px; height: 16px; background: #fff; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
  .navpop h3 { font-family: var(--sans); font-size: 1rem; text-align: center; margin: 0 24px 10px; }
  .navpop .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 1.5rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: .84rem; color: var(--ink-2); padding: 8px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-box { width: 16px; height: 16px; border: 1.5px dashed #6d6259; display: inline-block; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 10px; }
  .qcell { position: relative; height: 44px; border: 1.5px dashed #6d6259; background: #fff; color: var(--maroon); font-weight: 700; cursor: pointer; border-radius: 2px; }
  .qcell.answered { background: var(--maroon); border: 1.5px solid var(--maroon); color: #fff; }
  .qcell:hover { box-shadow: 0 0 0 2px var(--gold); }
  .qcell .flag { position: absolute; top: -8px; right: -6px; width: 14px; height: 16px; }
  .qcell .pin { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 14px; height: 16px; }
  .navpop .goto { display: block; margin: 16px auto 0; }

  /* Review page */
  .review-wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 48px; text-align: center; }
  .review-wrap h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
  .review-card { text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-top: 22px; box-shadow: var(--shadow); }
  .review-card .rc-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 18px; }
  .review-card .rc-head b { font-size: 1.02rem; }
  .review-card .legend { border: 0; padding: 0; margin: 0; }

  /* Interstitial screens */
  .screen { height: 100%; overflow-y: auto; }
  .screen-inner { max-width: 760px; margin: 0 auto; padding: 40px 24px 56px; }
  .spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--gold-soft); border-top-color: var(--maroon); animation: spin 1s linear infinite; margin: 0 auto 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .break-clock { font-family: var(--serif); font-size: clamp(3.4rem, 12vw, 6rem); color: var(--maroon); font-variant-numeric: tabular-nums; line-height: 1; margin: 10px 0 18px; }
  .structure { width: 100%; border-collapse: collapse; margin: 14px 0 20px; font-size: .98rem; }
  .structure th, .structure td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; }
  .structure th { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); }
  .intro-list { padding-left: 1.2em; }
  .intro-list li { margin-bottom: .45em; }
  .warn5 { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow-lg); }

  /* Reference sheet (panel styles live in assets/sh.css) */
  .refsheet { padding: 16px 18px; font-size: .95rem; }
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .ref-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
  .ref-item small { display: block; color: var(--muted); font-size: .78rem; margin-bottom: 4px; font-weight: 600; }
  .ref-item svg.fig { width: 100%; height: 70px; margin-bottom: 6px; }
  .refsheet ul { padding-left: 1.1em; margin: 0; }

  /* Annotation popover */
  .hl-pop { position: fixed; z-index: 80; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 300px; }
  .hl-pop textarea { width: 100%; min-height: 70px; border: 1.5px solid var(--line-2); border-radius: 8px; padding: 8px; font-size: .92rem; }
  .hl-pop .btn { min-height: 34px; padding: .3em .8em; font-size: .86rem; }
  .more-menu { position: absolute; right: 12px; top: 62px; z-index: 65; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-lg); min-width: 200px; padding: 6px; }
  .more-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .more-menu button:hover { background: var(--maroon-tint); color: var(--maroon); }

  /* Results */
  body.tr.results { overflow: auto; background: var(--ivory); }
  .res-top { background: var(--maroon-deep); color: #fff; }
  .res-top .wrap { display: flex; align-items: center; gap: 12px; min-height: 64px; }
  .res-top .brand { color: #fff; }
  .res-top .brand-tag { color: var(--gold); }
  .res { padding-top: 28px; padding-bottom: 40px; }
  .score-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center; }
  .score-big { font-family: var(--serif); font-size: clamp(3.4rem, 10vw, 5rem); color: var(--maroon); line-height: 1; }
  .score-big small { display: block; font-family: var(--sans); font-size: .9rem; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }
  .sec-scores { display: grid; gap: 12px; }
  .sec-score { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ivory); }
  .sec-score .sec-num { font-family: var(--serif); font-weight: 600; font-size: 1.8rem; color: var(--ink); }
  .bar { height: 8px; background: #EEE6DA; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--maroon); border-radius: 99px; }
  .dom-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 56px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .dom-row:last-child { border-bottom: 0; }
  .mod-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .mod-table th, .mod-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .mod-table th { font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters button { border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: .88rem; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--maroon); color: #fff; border-color: var(--maroon); }
  .qitem { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); margin-bottom: 10px; overflow: hidden; }
  .qitem > button { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: none; border: 0; cursor: pointer; text-align: left; }
  .qitem .res-ic { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
  .res-ic.ok { background: var(--ok); } .res-ic.no { background: var(--bad); } .res-ic.skip { background: #A79D91; }
  .qitem .qi-meta { font-size: .9rem; color: var(--muted); }
  .qitem .qi-meta b { color: var(--ink); }
  .qitem .qi-ans { font-size: .86rem; color: var(--muted); text-align: right; white-space: nowrap; }
  .qdetail { border-top: 1px solid var(--line); padding: 16px 18px 18px; }
  .qdetail .choices { margin: 12px 0; }
  .qdetail .choice { cursor: default; }
  .expl { background: var(--ivory); border-left: 3px solid var(--gold); padding: 12px 14px; border-radius: 0 8px 8px 0; margin-top: 12px; }

  @media (max-width: 860px) {
    .score-hero { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .tr-top { grid-template-columns: minmax(0, 1fr) auto auto; padding: 6px 10px; gap: 6px; min-height: 58px; }
    .tr-title { font-size: .88rem; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .tool { min-width: 40px; padding: 4px; font-size: 0; gap: 0; }
    .tool svg { width: 22px; height: 22px; }
    .tr-timer { font-size: 1.1rem; }
    .tr-main { overflow-y: auto; }
    .tr-split { flex-direction: column; height: auto; }
    .tr-pane { overflow: visible; padding: 18px 16px 22px; }
    .tr-lpane { flex: none; max-width: none; min-width: 0; border-bottom: 2px solid var(--line); background: #FCFAF6; }
    .tr-divider { display: none; }
    .tr-single, .screen { height: auto; min-height: 100%; }
    .tr-single-inner { padding: 18px 16px 28px; }
    .tr-bot { grid-template-columns: auto 1fr; padding: 8px 10px calc(8px + var(--safe-b)); }
    .tr-name { display: none; }
    .tr-navbtn { padding: 9px 10px; font-size: .9rem; }
    .tr-bot .btn { padding: .5em .9em; }
    .dom-row { grid-template-columns: minmax(0, 1fr) 70px 44px; }
    .navpop::after { display: none; }
    .qitem .qi-ans { display: none; }
    .qitem > button { grid-template-columns: 34px minmax(0, 1fr); }
  }
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  const SH = window.SH;
  if (!SH) { document.getElementById('app').innerHTML = '<div class="center-screen"><p>Something went wrong loading the page. Please refresh.</p></div>'; return; }
  const { esc, $, $$ } = SH;

  /* ---------------- Icons ---------------- */
  const IC = {
    caret: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    caretDown: '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    bookmark: '<svg viewBox="0 0 16 18" aria-hidden="true"><path d="M2 1.5h12v15l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    flag: '<svg class="flag" viewBox="0 0 16 18" aria-hidden="true"><path d="M2 1.5h12v15l-6-4-6 4z" fill="#A3312A" stroke="#fff" stroke-width="1.2"/></svg>',
    pin: '<svg class="pin" viewBox="0 0 16 20" aria-hidden="true"><path d="M8 19s6-6.2 6-11A6 6 0 1 0 2 8c0 4.8 6 11 6 11z" fill="#231A17"/><circle cx="8" cy="8" r="2.3" fill="#fff"/></svg>',
    pinLg: '<svg viewBox="0 0 16 20" width="14" height="17" aria-hidden="true"><path d="M8 19s6-6.2 6-11A6 6 0 1 0 2 8c0 4.8 6 11 6 11z" fill="#231A17"/><circle cx="8" cy="8" r="2.3" fill="#fff"/></svg>',
    flagLg: '<svg viewBox="0 0 16 18" width="14" height="16" aria-hidden="true"><path d="M2 1.5h12v15l-6-4-6 4z" fill="#A3312A"/></svg>',
    annotate: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.5 6.5l3 3" stroke="currentColor" stroke-width="1.8"/></svg>',
    calc: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="5.5" width="8" height="4" rx=".6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="12" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/><circle cx="9" cy="17" r="1" fill="currentColor"/><circle cx="12" cy="17" r="1" fill="currentColor"/><circle cx="15" cy="17" r="1" fill="currentColor"/></svg>',
    ref: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5l8 13V5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 5h5v5h-5zM15 14h5v6h-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    more: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>'
  };

  /* ---------------- Directions text ---------------- */
  const DIRECTIONS = {
    rw: '<p>This section tests a range of reading and writing skills.</p><p>Each question comes with one or more short passages, which can include a table or graph. Read the passage and the question carefully, then choose the best answer based on what the passage says.</p><p>Every question in this section is multiple choice with four answer choices, and each has a single best answer.</p>',
    math: '<p>This section tests a range of math skills. You may use the calculator on every question. The calculator, the reference sheet and these directions stay available for the whole module.</p><p>Unless a question says otherwise:</p><ul><li>All variables and expressions stand for real numbers.</li><li>Figures are drawn to scale and lie in a plane.</li><li>The domain of a function <i>f</i> is every real number <i>x</i> for which <i>f</i>(<i>x</i>) is a real number.</li></ul><p>For multiple-choice questions, solve the problem and pick the one correct answer. For student-produced response questions, solve the problem and type your answer in the box, following the rules shown next to those questions.</p>'
  };
  const SPR_DIRS = '<div class="spr-dirs"><h3>Student-produced response directions</h3><ul>' +
    '<li>If you find more than one correct answer, enter only one of them.</li>' +
    '<li>You can enter up to 5 characters for a positive answer and up to 6 characters (including the negative sign) for a negative answer.</li>' +
    '<li>If your answer is a fraction that does not fit, enter its decimal equivalent.</li>' +
    '<li>If your answer is a decimal that does not fit, enter it truncated or rounded at the fourth digit.</li>' +
    '<li>If your answer is a mixed number such as 3½, enter it as an improper fraction (7/2) or a decimal (3.5).</li>' +
    '<li>Do not enter symbols such as a percent sign, comma or dollar sign.</li></ul>' +
    '<table><thead><tr><th>Answer</th><th>Acceptable ways to enter it</th><th>Not accepted</th></tr></thead><tbody>' +
    '<tr><td>3.5</td><td>3.5 &nbsp; 3.50 &nbsp; 7/2</td><td>31/2 &nbsp; 3 1/2</td></tr>' +
    '<tr><td>2/3</td><td>2/3 &nbsp; .6666 &nbsp; .6667 &nbsp; 0.666 &nbsp; 0.667</td><td>0.66 &nbsp; .66 &nbsp; 0.67 &nbsp; .67</td></tr>' +
    '<tr><td>−1/3</td><td>−1/3 &nbsp; −.3333 &nbsp; −0.333</td><td>−.33 &nbsp; −0.33</td></tr>' +
    '</tbody></table></div>';

  /* ---------------- Setup ---------------- */
  const params = new URLSearchParams(location.search);
  const testId = (params.get('id') || 'diagnostic-mini').replace(/[^\w-]/g, '');
  const reviewId = params.get('review');
  const RUN_KEY = 'run.' + testId;
  const app = $('#app');
  let test = null;
  let S = null;
  let qShownAt = 0;
  let tickHandle = null;
  let lastTick = 0;
  let saveCounter = 0;
  let refPanel = null;

  init();

  async function init() {
    try { test = await SH.loadTest(testId); }
    catch (e) { return fatal('We could not load this practice test.', e.message); }
    const broken = test.sections.length === 0 || test.sections.some(s => !s.module1.questions.length || !s.module2.easier.questions.length || !s.module2.harder.questions.length);
    if (broken) return fatal('This practice test is incomplete.', 'Every section needs questions in Module 1 and in both versions of Module 2 (easier and harder).' + (test.errors.length ? ' Problems found: ' + test.errors.slice(0, 5).join('; ') : ''));
    document.title = test.title + ' · Scholar’s Hub';
    if (reviewId) {
      const rec = SH.getTestHistory().find(r => r.id === reviewId);
      if (rec) return showResults(rec);
    }
    const saved = SH.store.get(RUN_KEY, null);
    renderIntro(saved && saved.v === 1 ? saved : null);
  }

  function fatal(title, detail) {
    document.body.classList.add('results');
    app.innerHTML = '<div class="center-screen"><h1 style="font-size:1.8rem">' + esc(title) + '</h1><p class="muted" style="max-width:560px">' + esc(detail || '') + '</p><p><a class="btn btn-primary" href="practice.html#tests">Back to practice</a></p></div>';
  }

  /* ---------------- Helpers on test structure ---------------- */
  const sec = () => test.sections[S.sec];
  const mod = () => S.mod === 0 ? sec().module1 : sec().module2[S.routes[sec().id]];
  const qs = () => mod().questions;
  const curQ = () => qs()[S.qi];
  const modLabel = () => 'Section ' + (S.sec + 1) + ', Module ' + (S.mod + 1) + ': ' + sec().title;
  function takenQuestions(routes) {
    const out = [];
    test.sections.forEach((s, si) => {
      s.module1.questions.forEach((q, i) => out.push({ q, sec: s, si, mod: 0, n: i + 1 }));
      const r = routes[s.id];
      if (r) s.module2[r].questions.forEach((q, i) => out.push({ q, sec: s, si, mod: 1, n: i + 1 }));
    });
    return out;
  }
  function save() { if (S) SH.store.set(RUN_KEY, S); }

  /* ---------------- Intro ---------------- */
  function renderIntro(saved) {
    stopTick();
    const p = SH.getProfile();
    let rows = '', totalQ = 0, totalMin = 0;
    test.sections.forEach((s, i) => {
      const n1 = s.module1.questions.length, n2 = s.module2.harder.questions.length;
      const m1 = s.module1.minutes, m2 = s.module2.harder.minutes;
      totalQ += n1 + n2; totalMin += m1 + m2;
      rows += '<tr><td><b>' + esc(s.title) + '</b></td><td>2 modules</td><td>' + (n1 + n2) + ' questions</td><td>' + (m1 + m2) + ' min</td></tr>';
      if (i === 0 && test.sections.length > 1 && test.breakMinutes > 0) rows += '<tr><td class="muted">Break</td><td></td><td></td><td class="muted">' + test.breakMinutes + ' min</td></tr>';
    });
    const resume = saved ? '<div class="notice notice-warn" style="margin-bottom:18px"><b>You have a test in progress.</b> You were in ' + esc(saved.phase === 'break' ? 'the break' : 'Section ' + (saved.sec + 1) + ', Module ' + (saved.mod + 1)) + '. The clock paused when you left.</div>' : '';
    app.innerHTML =
      '<div class="screen"><div class="screen-inner">' +
      '<a href="practice.html#tests" class="small">&larr; Back to practice</a>' +
      '<span class="kicker" style="margin-top:22px">Practice test</span>' +
      '<h1 style="font-size:clamp(1.9rem,5vw,2.6rem)">' + esc(test.title) + '</h1>' +
      (test.description ? '<p class="muted">' + esc(test.description) + '</p>' : '') +
      resume +
      '<table class="structure"><thead><tr><th>Section</th><th>Format</th><th>Questions</th><th>Time</th></tr></thead><tbody>' + rows +
      '<tr><td><b>Total</b></td><td></td><td><b>' + totalQ + '</b></td><td><b>' + (totalMin + (test.sections.length > 1 ? test.breakMinutes : 0)) + ' min</b></td></tr></tbody></table>' +
      '<h3>How it works</h3><ul class="intro-list">' +
      '<li>Each section has two timed modules. How you do in Module 1 decides whether Module 2 is easier or harder, just like the real digital SAT.</li>' +
      '<li>Inside a module you can skip around, mark questions for review and cross out choices. Once a module ends, you can’t go back to it.</li>' +
      '<li>When time runs out, the module ends on its own. Unanswered questions count as wrong, so always put something down.</li>' +
      '<li>Reading and Writing has an annotation tool. Math has a graphing calculator and a reference sheet.</li>' +
      '<li>Your progress saves on this device. If you close the tab, the clock pauses and you can pick up where you left off.</li></ul>' +
      '<form id="start-form" style="margin-top:22px">' +
      (saved ? '' : '<div class="field" style="max-width:360px"><label for="sname">Your name (shown at the bottom of the screen)</label><input class="input" id="sname" maxlength="40" autocomplete="name" value="' + esc(p.name) + '"></div>') +
      '<div class="row">' +
      (saved ? '<button class="btn btn-primary" type="submit">Continue test</button><button class="btn btn-ghost" type="button" id="restart">Start over</button>'
        : '<button class="btn btn-primary" type="submit">Start the test</button>') +
      '</div></form></div></div>';
    $('#start-form').addEventListener('submit', e => {
      e.preventDefault();
      if (saved) { S = saved; resumeRun(); return; }
      const name = ($('#sname').value || '').trim();
      if (name) SH.setProfile({ name });
      startRun(name);
    });
    const rs = $('#restart');
    if (rs) rs.addEventListener('click', () => {
      SH.modal({
        title: 'Start over?', html: '<p>Your answers from the test in progress will be cleared.</p>',
        actions: [{ label: 'Cancel', kind: 'ghost' }, { label: 'Start over', kind: 'primary', onClick: () => { SH.store.del(RUN_KEY); renderIntro(null); } }]
      });
    });
  }

  function startRun(name) {
    S = {
      v: 1, testId, startedAt: Date.now(), name: name || 'Student',
      phase: 'module', sec: 0, mod: 0, qi: 0, routes: {},
      remaining: 0, breakRemaining: 0, warned: false, timerHidden: false, elim: false,
      responses: {}, marked: {}, struck: {}, annot: {}, notes: {}, time: {}, moduleLog: []
    };
    startModule();
  }
  function resumeRun() {
    if (S.phase === 'break') return renderBreak();
    if (S.phase === 'transition') { return startModule(); }
    renderShell();
    if (S.phase === 'review') renderReview(); else renderQuestion();
    startTick();
  }

  /* ---------------- Module lifecycle ---------------- */
  function startModule() {
    S.phase = 'module'; S.qi = 0; S.remaining = mod().minutes * 60000; S.warned = false; S.elim = false;
    save();
    renderShell();
    renderQuestion();
    startTick();
    openDirections();
  }
  function moduleCorrect(list) { return list.reduce((n, q) => n + (SH.isCorrect(q, S.responses[q.id]) ? 1 : 0), 0); }
  function endModule() {
    leaveQuestion();
    stopTick();
    closePanels();
    const list = qs();
    const correct = moduleCorrect(list);
    S.moduleLog.push({ sec: sec().id, mod: S.mod, route: S.mod === 1 ? S.routes[sec().id] : null, correct, n: list.length, usedMs: mod().minutes * 60000 - Math.max(0, S.remaining) });
    if (S.mod === 0) {
      S.routes[sec().id] = (correct / list.length) >= test.routing.threshold ? 'harder' : 'easier';
      S.mod = 1;
      S.phase = 'transition';
      save();
      renderTransition('Module 1 complete', 'Getting your next module ready…', startModule);
      return;
    }
    if (S.sec < test.sections.length - 1) {
      S.sec += 1; S.mod = 0; S.qi = 0;
      if (test.breakMinutes > 0) {
        S.phase = 'break'; S.breakRemaining = test.breakMinutes * 60000; save();
        renderBreak();
      } else {
        S.phase = 'transition'; save();
        renderTransition('Section complete', 'Getting the next section ready…', startModule);
      }
      return;
    }
    finish();
  }

  function renderTransition(title, sub, next) {
    app.innerHTML = '<div class="center-screen"><div class="spinner" aria-hidden="true"></div><h2>' + esc(title) + '</h2><p class="muted">' + esc(sub) + '</p></div>';
    setTimeout(next, 1600);
  }

  /* ---------------- Break ---------------- */
  function renderBreak() {
    stopTick();
    app.innerHTML =
      '<div class="center-screen"><span class="kicker">Practice test break</span>' +
      '<h1 style="font-size:clamp(1.8rem,5vw,2.5rem)">Take a short break</h1>' +
      '<div class="break-clock" id="break-clock">' + SH.fmtClock(S.breakRemaining / 1000) + '</div>' +
      '<p class="muted" style="max-width:520px">Stand up, stretch, drink some water. The Math section starts when the clock reaches zero. On test day you wait out the full break; here you can start early if you’re ready.</p>' +
      '<button class="btn btn-primary" id="resume-btn" type="button">Resume testing</button></div>';
    $('#resume-btn').addEventListener('click', endBreak);
    startTick();
  }
  function endBreak() { stopTick(); startModule(); }

  /* ---------------- Timer ---------------- */
  function startTick() {
    stopTick();
    lastTick = performance.now();
    tickHandle = setInterval(tick, 1000);
    paintTimer();
  }
  function stopTick() { if (tickHandle) clearInterval(tickHandle); tickHandle = null; }
  function tick() {
    const now = performance.now();
    const dt = Math.min(90000, now - lastTick); // a sleeping device pauses the clock
    lastTick = now;
    if (S.phase === 'break') {
      S.breakRemaining -= dt;
      const el = $('#break-clock'); if (el) el.textContent = SH.fmtClock(S.breakRemaining / 1000);
      if (S.breakRemaining <= 0) { endBreak(); return; }
    } else if (S.phase === 'module' || S.phase === 'review') {
      S.remaining -= dt;
      if (S.remaining <= 5 * 60000 && !S.warned && mod().minutes > 5) {
        S.warned = true; S.timerHidden = false;
        const w = document.createElement('div'); w.className = 'warn5'; w.setAttribute('role', 'alert'); w.textContent = '5 minutes left in this module';
        const main = $('#tr-main'); if (main) { main.appendChild(w); setTimeout(() => w.remove(), 6000); }
      }
      paintTimer();
      if (S.remaining <= 0) { S.remaining = 0; endModule(); return; }
    }
    if (++saveCounter % 5 === 0) save();
  }
  function paintTimer() {
    const t = $('#tr-timer'); if (!t || !S) return;
    t.textContent = SH.fmtClock(Math.ceil(Math.max(0, S.remaining) / 1000));
    t.classList.toggle('low', S.remaining <= 5 * 60000);
    t.classList.toggle('hidden-t', !!S.timerHidden);
    const h = $('#tr-hide');
    if (h) { h.textContent = S.timerHidden ? 'Show' : 'Hide'; h.hidden = S.remaining <= 5 * 60000 && S.warned; }
  }

  /* ---------------- Shell ---------------- */
  function renderShell() {
    const isMath = sec().id === 'math';
    const tools = isMath
      ? '<button class="tool" type="button" id="t-calc" aria-pressed="false">' + IC.calc + 'Calculator</button><button class="tool" type="button" id="t-ref" aria-pressed="false">' + IC.ref + 'Reference</button>'
      : '<button class="tool" type="button" id="t-annot">' + IC.annotate + 'Annotate</button>';
    app.innerHTML =
      '<header class="tr-top">' +
      '<div class="tr-left"><div class="tr-title">' + esc(modLabel()) + '</div><button class="tr-dir" type="button" id="t-dir">Directions ' + IC.caretDown + '</button></div>' +
      '<div class="tr-center"><div class="tr-timer" id="tr-timer" role="timer" aria-live="off"></div><button class="tr-hide" id="tr-hide" type="button">Hide</button></div>' +
      '<div class="tr-right">' + tools + '<button class="tool" type="button" id="t-more" aria-haspopup="true" aria-expanded="false">' + IC.more + 'More</button></div>' +
      '</header><div class="tr-dash" aria-hidden="true"></div>' +
      '<main class="tr-main" id="tr-main" tabindex="-1"></main>' +
      '<footer class="tr-bot"><div class="tr-name">' + esc(S.name) + '</div>' +
      '<div class="tr-bot-c"><button class="tr-navbtn" type="button" id="t-nav" aria-expanded="false">Question 1 of 1 ' + IC.caret + '</button></div>' +
      '<div class="tr-bot-r"><button class="btn btn-ghost" type="button" id="t-back">Back</button><button class="btn btn-primary" type="button" id="t-next">Next</button></div></footer>';
    $('#t-dir').addEventListener('click', openDirections);
    $('#tr-hide').addEventListener('click', () => { S.timerHidden = !S.timerHidden; paintTimer(); save(); });
    $('#t-more').addEventListener('click', toggleMore);
    $('#t-nav').addEventListener('click', toggleNav);
    $('#t-back').addEventListener('click', goBack);
    $('#t-next').addEventListener('click', goNext);
    if (isMath) {
      $('#t-calc').addEventListener('click', toggleCalc);
      $('#t-ref').addEventListener('click', toggleRef);
    } else {
      $('#t-annot').addEventListener('click', () => {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) { SH.toast('Select some text in the passage first, then tap Annotate.'); return; }
        const id = highlightSelection();
        if (id) openHlPop(id);
      });
    }
    paintTimer();
  }

  function openDirections() {
    SH.modal({ title: 'Directions', html: DIRECTIONS[sec().id], actions: [{ label: 'Close', kind: 'primary' }] });
  }

  /* ---------------- Navigation ---------------- */
  function leaveQuestion() {
    if (S && S.phase === 'module' && qShownAt) {
      const q = curQ();
      if (q) S.time[q.id] = (S.time[q.id] || 0) + (Date.now() - qShownAt);
    }
    qShownAt = 0;
    closeHlPop();
  }
  function goTo(i) {
    leaveQuestion();
    S.phase = 'module'; S.qi = Math.max(0, Math.min(qs().length - 1, i));
    save(); closeNav(); renderQuestion();
  }
  function goBack() {
    if (S.phase === 'review') { leaveQuestion(); S.phase = 'module'; S.qi = qs().length - 1; save(); renderQuestion(); return; }
    if (S.qi > 0) goTo(S.qi - 1);
  }
  function goNext() {
    if (S.phase === 'review') { endModule(); return; }
    if (S.qi < qs().length - 1) goTo(S.qi + 1);
    else { leaveQuestion(); S.phase = 'review'; save(); closeNav(); renderReview(); }
  }

  function updateFooter() {
    const nav = $('#t-nav'), back = $('#t-back'), next = $('#t-next');
    if (S.phase === 'review') {
      nav.parentElement.style.visibility = 'hidden';
      back.style.visibility = 'visible';
      next.textContent = 'Next';
    } else {
      nav.parentElement.style.visibility = 'visible';
      nav.innerHTML = 'Question ' + (S.qi + 1) + ' of ' + qs().length + ' ' + IC.caret;
      back.style.visibility = S.qi === 0 ? 'hidden' : 'visible';
      next.textContent = 'Next';
    }
  }

  /* ---------------- Question rendering ---------------- */
  function qbarHtml(q) {
    const marked = !!S.marked[q.id];
    return '<div class="qbar" data-qid="' + esc(q.id) + '"><span class="qnum" aria-label="Question ' + (S.qi + 1) + '">' + (S.qi + 1) + '</span>' +
      '<button class="mark-btn" type="button" id="q-mark" aria-pressed="' + marked + '">' + IC.bookmark + ' Mark for Review</button>' +
      (q.type === 'mc' ? '<button class="abc-btn" type="button" id="q-abc" aria-pressed="' + !!S.elim + '" title="Cross out answer choices" aria-label="Answer choice eliminator">ABC</button>' : '') +
      '</div>';
  }
  function choicesHtml(q) {
    const resp = S.responses[q.id];
    const struck = S.struck[q.id] || [];
    return '<ul class="choices" role="radiogroup" aria-label="Answer choices">' + q.choices.map((c, i) => {
      const L = SH.LETTERS[i];
      const isStruck = struck.indexOf(L) > -1;
      const strike = S.elim ? (isStruck
        ? '<button type="button" class="strike-btn is-undo" data-strike="' + L + '" aria-label="Undo cross out for choice ' + L + '">Undo</button>'
        : '<button type="button" class="strike-btn" data-strike="' + L + '" aria-label="Cross out choice ' + L + '"><span class="s-letter">' + L + '</span></button>') : '';
      return '<li class="choice-row"><button type="button" role="radio" class="choice' + (isStruck ? ' is-struck' : '') + '" aria-checked="' + (resp === L) + '" data-choice="' + L + '"><span class="letter">' + L + '</span><span class="choice-text rich">' + SH.renderRich(c, { inline: true }) + '</span></button>' + strike + '</li>';
    }).join('') + '</ul>';
  }
  function bindChoices(q) {
    const host = $('#q-choices');
    host.innerHTML = choicesHtml(q);
    $$('[data-choice]', host).forEach(b => b.addEventListener('click', () => {
      const L = b.dataset.choice;
      const st = S.struck[q.id] || [];
      if (st.indexOf(L) > -1) S.struck[q.id] = st.filter(x => x !== L);
      S.responses[q.id] = L;
      save(); bindChoices(q);
      const again = host.querySelector('[data-choice="' + L + '"]'); if (again) again.focus();
    }));
    $$('[data-strike]', host).forEach(b => b.addEventListener('click', () => {
      const L = b.dataset.strike;
      const st = S.struck[q.id] || [];
      if (st.indexOf(L) > -1) S.struck[q.id] = st.filter(x => x !== L);
      else { S.struck[q.id] = st.concat(L); if (S.responses[q.id] === L) delete S.responses[q.id]; }
      save(); bindChoices(q);
      const again = host.querySelector('[data-strike="' + L + '"]'); if (again) again.focus();
    }));
  }
  function bindChoiceKeys() {
    const host = $('#q-choices');
    if (!host) return;
    // arrow keys move within the radio group
    host.addEventListener('keydown', e => {
      if (['ArrowDown', 'ArrowUp'].indexOf(e.key) < 0) return;
      const items = $$('[data-choice]', host); const i = items.indexOf(document.activeElement);
      if (i < 0) return; e.preventDefault();
      items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
    });
  }
  function sprHtml(q) {
    const v = S.responses[q.id] || '';
    return '<div class="spr"><label class="label" for="spr-in">Your answer</label><input id="spr-in" inputmode="decimal" autocomplete="off" spellcheck="false" value="' + esc(v) + '" aria-describedby="spr-prev"><div class="spr-preview" id="spr-prev">' + (v ? 'Answer preview: <b>' + SH.sprPreview(v) + '</b>' : '') + '</div></div>';
  }

  function renderQuestion() {
    S.phase = 'module';
    const q = curQ();
    const main = $('#tr-main');
    const isRW = sec().id === 'rw';
    const promptHtml = '<div class="q-prompt rich" id="q-prompt">' + SH.renderRich(q.prompt) + '</div>';
    const answerHtml = q.type === 'mc' ? '<div id="q-choices"></div>' : sprHtml(q);
    const hasStim = !!(q.passage || q.table || q.image);
    if (isRW && hasStim) {
      main.innerHTML = '<div class="tr-split" id="split">' +
        '<section class="tr-pane tr-lpane" aria-label="Passage"><div class="passage rich" id="passage"></div></section>' +
        '<div class="tr-divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"><span aria-hidden="true">&#8596;</span></div>' +
        '<section class="tr-pane tr-rpane" aria-label="Question">' + qbarHtml(q) + promptHtml + answerHtml + '</section></div>';
      const pas = $('#passage');
      pas.innerHTML = S.annot[q.id] || SH.renderStimulus(q);
      bindPassage(q, pas);
      bindDivider();
    } else if (q.type === 'spr') {
      main.innerHTML = '<div class="tr-split" id="split">' +
        '<section class="tr-pane tr-lpane" aria-label="Directions">' + SPR_DIRS + '</section>' +
        '<div class="tr-divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"><span aria-hidden="true">&#8596;</span></div>' +
        '<section class="tr-pane tr-rpane" aria-label="Question">' + qbarHtml(q) + (hasStim ? '<div class="rich" style="margin-bottom:14px">' + SH.renderStimulus(q) + '</div>' : '') + promptHtml + answerHtml + '</section></div>';
      bindDivider();
    } else {
      main.innerHTML = '<div class="tr-single"><div class="tr-single-inner">' + qbarHtml(q) +
        (hasStim ? '<div class="rich" style="margin-bottom:14px">' + SH.renderStimulus(q) + '</div>' : '') + promptHtml + answerHtml + '</div></div>';
    }
    const split = $('#split'); if (split && S.split) split.style.setProperty('--split', S.split + '%');
    $('#q-mark').addEventListener('click', e => {
      if (S.marked[q.id]) delete S.marked[q.id]; else S.marked[q.id] = true;
      e.currentTarget.setAttribute('aria-pressed', !!S.marked[q.id]); save();
    });
    const abc = $('#q-abc');
    if (abc) abc.addEventListener('click', () => { S.elim = !S.elim; abc.setAttribute('aria-pressed', S.elim); bindChoices(q); save(); });
    if (q.type === 'mc') { bindChoices(q); bindChoiceKeys(); }
    else {
      const inp = $('#spr-in'), prev = $('#spr-prev');
      inp.addEventListener('input', () => {
        const clean = SH.sprSanitize(inp.value);
        if (clean !== inp.value) inp.value = clean;
        if (clean) S.responses[q.id] = clean; else delete S.responses[q.id];
        prev.innerHTML = clean ? 'Answer preview: <b>' + SH.sprPreview(clean) + '</b>' : '';
        save();
      });
    }
    updateFooter();
    qShownAt = Date.now();
    main.scrollTop = 0;
    $$('.tr-pane, .tr-single', main).forEach(p => { p.scrollTop = 0; });
  }

  function bindDivider() {
    const d = $('#divider'), split = $('#split');
    if (!d || !split) return;
    const setPct = p => { p = Math.max(25, Math.min(70, p)); S.split = Math.round(p); split.style.setProperty('--split', S.split + '%'); };
    d.addEventListener('pointerdown', e => {
      d.setPointerCapture(e.pointerId);
      const rect = split.getBoundingClientRect();
      const move = ev => setPct(((ev.clientX - rect.left) / rect.width) * 100);
      const up = () => { d.removeEventListener('pointermove', move); d.removeEventListener('pointerup', up); save(); };
      d.addEventListener('pointermove', move); d.addEventListener('pointerup', up);
    });
    d.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setPct((S.split || 50) + (e.key === 'ArrowLeft' ? -5 : 5)); save(); }
    });
  }

  /* ---------------- Review page ---------------- */
  function gridHtml() {
    return '<div class="qgrid">' + qs().map((q, i) => {
      const answered = S.responses[q.id] != null && S.responses[q.id] !== '';
      const label = 'Question ' + (i + 1) + (answered ? ', answered' : ', unanswered') + (S.marked[q.id] ? ', marked for review' : '') + (S.phase === 'module' && i === S.qi ? ', current' : '');

  /* ---------------- Annotation ---------------- */
  function bindPassage(q, pas) {
    pas.addEventListener('mouseup', () => setTimeout(() => maybeOfferHighlight(pas), 0));
    pas.addEventListener('touchend', () => setTimeout(() => maybeOfferHighlight(pas), 250));
    pas.addEventListener('click', e => {
      const m = e.target.closest('mark.hl');
      if (m && window.getSelection().isCollapsed) openHlPop(m.dataset.hl, m);
    });
  }
  function maybeOfferHighlight(pas) {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0);
    if (!pas.contains(r.commonAncestorContainer)) return;
    closeHlPop();
    const rect = r.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'hl-pop';
    pop.innerHTML = '<button type="button" class="btn btn-gold" data-a="hl">Highlight</button><button type="button" class="btn btn-ghost" data-a="note">Highlight + note</button>';
    placePop(pop, rect);
    pop.querySelector('[data-a="hl"]').addEventListener('mousedown', e => e.preventDefault());
    pop.querySelector('[data-a="note"]').addEventListener('mousedown', e => e.preventDefault());
    pop.querySelector('[data-a="hl"]').addEventListener('click', () => { highlightSelection(); closeHlPop(); });
    pop.querySelector('[data-a="note"]').addEventListener('click', () => { const id = highlightSelection(); if (id) openHlPop(id); });
  }
  function placePop(pop, rect) {
    document.body.appendChild(pop);
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let top = rect.bottom + 8; if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 8);
    const left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width / 2 - w / 2));
    pop.style.top = top + 'px'; pop.style.left = left + 'px';
  }
  function highlightSelection() {
    const pas = $('#passage'); const q = curQ();
    const sel = window.getSelection();
    if (!pas || !sel || !sel.rangeCount || sel.isCollapsed) return null;
    const range = sel.getRangeAt(0);
    if (!pas.contains(range.commonAncestorContainer)) return null;
    const walker = document.createTreeWalker(pas, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (range.intersectsNode(n) && n.nodeValue.length && !n.parentElement.closest('.katex')) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    if (!nodes.length) return null;
    const id = SH.uid('hl');
    nodes.forEach(node => {
      let start = 0, end = node.nodeValue.length;
      if (node === range.startContainer) start = range.startOffset;
      if (node === range.endContainer) end = range.endOffset;
      if (start >= end) return;
      const mid = node.splitText(start); mid.splitText(end - start);
      if (!mid.nodeValue.trim()) return;
      const mark = document.createElement('mark'); mark.className = 'hl'; mark.dataset.hl = id;
      mid.parentNode.insertBefore(mark, mid); mark.appendChild(mid);
    });
    sel.removeAllRanges();
    S.annot[q.id] = pas.innerHTML; save();
    return id;
  }
  function openHlPop(id, anchor) {
    closeHlPop();
    const pas = $('#passage'); if (!pas) return;
    const marks = $$('mark[data-hl="' + id + '"]', pas); if (!marks.length) return;
    const rect = (anchor || marks[0]).getBoundingClientRect();
    const pop = document.createElement('div'); pop.className = 'hl-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Highlight');
    pop.innerHTML = '<label class="sr-only" for="hl-note">Note</label><textarea id="hl-note" placeholder="Add a note (optional)"></textarea>' +
      '<button type="button" class="btn btn-primary" data-a="save">Save</button><button type="button" class="btn btn-ghost" data-a="del">Remove highlight</button>';
    placePop(pop, rect);
    const ta = pop.querySelector('textarea'); ta.value = S.notes[id] || ''; ta.focus();
    pop.querySelector('[data-a="save"]').addEventListener('click', () => {
      const v = ta.value.trim();
      if (v) S.notes[id] = v; else delete S.notes[id];
      marks.forEach(m => { m.classList.toggle('has-note', !!v); if (v) m.title = v; else m.removeAttribute('title'); });
      S.annot[curQ().id] = pas.innerHTML; save(); closeHlPop();
    });
    pop.querySelector('[data-a="del"]').addEventListener('click', () => {
      marks.forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); });
      pas.normalize(); delete S.notes[id];
      S.annot[curQ().id] = pas.innerHTML; save(); closeHlPop();
    });
  }

  /* ---------------- Finish & scoring ---------------- */
  function sectionScore(s, routes, responses) {
    const route = routes[s.id];
    const m1 = s.module1.questions, m2 = s.module2[route].questions;
    const c1 = m1.filter(q => SH.isCorrect(q, responses[q.id])).length;
    const c2 = m2.filter(q => SH.isCorrect(q, responses[q.id])).length;
    const w = route === 'harder' ? test.scoring.m2HardWeight : test.scoring.m2EasyWeight;
    const frac = (c1 + w * c2) / (m1.length + test.scoring.m2HardWeight * m2.length);
    return { score: Math.max(200, Math.min(800, Math.round((200 + 600 * frac) / 10) * 10)), route, c1, n1: m1.length, c2, n2: m2.length };
  }
  function finish() {
    stopTick();
    const taken = takenQuestions(S.routes);
    const responses = {};
    taken.forEach(t => { if (S.responses[t.q.id] != null) responses[t.q.id] = S.responses[t.q.id]; });
    const rec = {
      id: SH.uid('t'), testId, title: test.title, name: S.name, startedAt: S.startedAt, finishedAt: Date.now(),
      routes: S.routes, responses, marked: S.marked, time: S.time, moduleLog: S.moduleLog, sections: {}
    };
    let total = 0;
    test.sections.forEach(s => { const r = sectionScore(s, S.routes, responses); rec.sections[s.id] = r; total += r.score; });
    rec.total = test.sections.length === 2 ? total : null;
    SH.recordAttempts(taken.map(t => ({
      qid: t.q.id, section: t.q.section, domain: t.q.domain, skill: t.q.skill, difficulty: t.q.difficulty,
      correct: SH.isCorrect(t.q, responses[t.q.id]), ms: S.time[t.q.id] || 0, source: 'test'
    })));
    SH.addTestHistory(rec);
    SH.store.del(RUN_KEY);
    S = null;
    try { history.replaceState(null, '', 'test.html?id=' + encodeURIComponent(testId) + '&review=' + encodeURIComponent(rec.id)); } catch (e) { /* ignore */ }
    showResults(rec);
  }

  /* ---------------- Results ---------------- */
  function showResults(rec) {
    stopTick(); closePanels();
    document.body.classList.add('results');
    const taken = takenQuestions(rec.routes);
    const fmtMin = ms => SH.fmtClock((ms || 0) / 1000);
    const fmtSec = ms => ms ? Math.round(ms / 1000) + 's' : '';
    const secRows = test.sections.map(s => {
      const r = rec.sections[s.id] || sectionScore(s, rec.routes, rec.responses);
      return '<div class="sec-score"><div><div class="small muted">' + esc(s.title) + '</div><div class="small">Module 2: <b>' + (r.route === 'harder' ? 'harder' : 'easier') + '</b></div></div><span class="sec-num">' + r.score + '</span></div>';
    }).join('');
    const modRows = (rec.moduleLog || []).map(m => {
      const s = test.sections.find(x => x.id === m.sec);
      return '<tr><td>' + esc(s ? s.title : m.sec) + ', Module ' + (m.mod + 1) + (m.route ? ' <span class="small muted">(' + m.route + ')</span>' : '') + '</td><td>' + m.correct + ' / ' + m.n + '</td><td>' + fmtMin(m.usedMs) + '</td></tr>';
    }).join('');
    const doms = {};
    taken.forEach(t => {
      const k = t.q.section + '|' + (t.q.domain || 'Other');
      if (!doms[k]) doms[k] = { sec: t.q.section, name: t.q.domain || 'Other', c: 0, n: 0 };
      doms[k].n++; if (SH.isCorrect(t.q, rec.responses[t.q.id])) doms[k].c++;
    });
    const domRows = Object.values(doms).map(d => '<div class="dom-row"><div><span class="tag tag-' + d.sec + '">' + (d.sec === 'rw' ? 'R&amp;W' : 'Math') + '</span> ' + esc(d.name) + '</div><div class="bar"><i style="width:' + SH.pct(d.c, d.n) + '%"></i></div><div><b>' + d.c + '/' + d.n + '</b></div></div>').join('');

    app.className = '';
    app.innerHTML =
      '<header class="res-top"><div class="wrap"><a class="brand" href="index.html"><img src="logo.jpg" alt="" width="40" height="40"><span><span class="brand-name">Scholar’s Hub</span><span class="brand-tag">SAT practice</span></span></a><a class="btn btn-light btn-sm" href="practice.html#tests">Back to practice</a></div></header>' +
      '<main class="wrap res" id="tr-main">' +
      '<section class="card score-hero"><div><span class="kicker">Practice test results</span><h1 style="font-size:clamp(1.6rem,4vw,2.2rem)">' + esc(rec.title) + '</h1>' +
      '<p class="muted small">' + esc(rec.name || '') + ' · ' + SH.fmtDate(rec.finishedAt) + '</p>' +
      (rec.total != null ? '<div class="score-big">' + rec.total + '<small>Estimated total score (400–1600)</small></div>' : '') +
      '</div><div class="sec-scores">' + secRows + '<p class="small muted" style="margin:0">This is an estimate. The real SAT scores each question with item response theory, so treat it as a ballpark, not a prediction.</p></div></section>' +
      '<div class="row" style="margin:16px 0 26px"><a class="btn btn-primary" href="test.html?id=' + encodeURIComponent(rec.testId) + '">Retake this test</a><a class="btn btn-ghost" href="practice.html#home">Practice my weak skills</a></div>' +
      '<div class="grid grid-2"><section class="card"><h3>Modules</h3><table class="mod-table"><thead><tr><th>Module</th><th>Correct</th><th>Time used</th></tr></thead><tbody>' + modRows + '</tbody></table></section>' +
      '<section class="card"><h3>By content domain</h3>' + domRows + '</section></div>' +
      '<section style="margin-top:26px"><h2 style="font-size:1.6rem">Review every question</h2>' +
      '<div class="filters" role="group" aria-label="Filter questions"><button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="wrong" aria-pressed="false">Incorrect</button><button type="button" data-f="marked" aria-pressed="false">Marked</button><button type="button" data-f="blank" aria-pressed="false">Unanswered</button></div>' +
      '<div id="qlist"></div></section></main>';

    const list = $('#qlist');
    function draw(filter) {
      const items = taken.filter(t => {
        const r = rec.responses[t.q.id]; const ok = SH.isCorrect(t.q, r);
        if (filter === 'wrong') return !ok;
        if (filter === 'marked') return rec.marked && rec.marked[t.q.id];
        if (filter === 'blank') return r == null || r === '';
        return true;
      });
      list.innerHTML = items.length ? items.map((t, i) => {
        const r = rec.responses[t.q.id]; const ok = SH.isCorrect(t.q, r); const blank = r == null || r === '';
        return '<div class="qitem" data-qid="' + esc(t.q.id) + '"><button type="button" aria-expanded="false">' +
          '<span class="res-ic ' + (ok ? 'ok' : blank ? 'skip' : 'no') + '" aria-label="' + (ok ? 'Correct' : blank ? 'Unanswered' : 'Incorrect') + '">' + (ok ? '✓' : blank ? '–' : '✕') + '</span>' +
          '<span class="qi-meta"><b>' + esc(t.sec.title) + ' · M' + (t.mod + 1) + ' · Q' + t.n + '</b><br>' + esc(t.q.skill || t.q.domain || '') + (rec.marked && rec.marked[t.q.id] ? ' · marked' : '') + '</span>' +
          '<span class="qi-ans">Yours: <b>' + esc(blank ? '—' : r) + '</b> · Answer: <b>' + esc(SH.answerLabel(t.q)) + '</b><br>' + fmtSec(rec.time && rec.time[t.q.id]) + '</span>' +
          '</button></div>';
      }).join('') : '<p class="muted">Nothing here.</p>';
      $$('.qitem > button', list).forEach(b => b.addEventListener('click', () => {
        const item = b.parentElement;
        const open = b.getAttribute('aria-expanded') === 'true';
        const ex = item.querySelector('.qdetail');
        if (open) { if (ex) ex.remove(); b.setAttribute('aria-expanded', 'false'); return; }
        b.setAttribute('aria-expanded', 'true');
        const t = taken.find(x => x.q.id === item.dataset.qid);
        item.insertAdjacentHTML('beforeend', detailHtml(t.q, rec.responses[t.q.id]));
        const tb = item.querySelector('[data-tutor]');
        if (tb) tb.addEventListener('click', () => SH.openTutor({ question: t.q, response: rec.responses[t.q.id], correct: SH.isCorrect(t.q, rec.responses[t.q.id]) }));
      }));
    }
    draw('all');
    $$('[data-f]').forEach(b => b.addEventListener('click', () => {
      $$('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      draw(b.dataset.f);
    }));
    window.scrollTo(0, 0);
  }
  function detailHtml(q, r) {
    let ans = '';
    if (q.type === 'mc') {
      ans = '<ul class="choices">' + q.choices.map((c, i) => {
        const L = SH.LETTERS[i];
        const cls = L === q.answer ? ' is-correct' : (L === r ? ' is-wrong' : '');
        return '<li class="choice-row"><div class="choice' + cls + '"><span class="letter">' + L + '</span><span class="choice-text rich">' + SH.renderRich(c, { inline: true }) + '</span></div></li>';
      }).join('') + '</ul>';
    } else {
      ans = '<p style="margin-top:12px">Your answer: <b>' + esc(r || '—') + '</b> · Accepted: <b>' + esc(q.answer.join(', ')) + '</b></p>';
    }
    return '<div class="qdetail">' + (q.passage || q.table || q.image ? '<div class="rich" style="margin-bottom:12px">' + SH.renderStimulus(q) + '</div>' : '') +
      '<div class="rich"><strong>' + SH.renderRich(q.prompt, { inline: true }) + '</strong></div>' + ans +
      (q.explanation ? '<div class="expl rich"><strong>Explanation.</strong> ' + SH.renderRich(q.explanation) + '</div>' : '') +
      '<p style="margin:14px 0 0"><button type="button" class="btn btn-ghost btn-sm" data-tutor>Ask the AI tutor about this</button></p></div>';
  }

  window.addEventListener('beforeunload', () => { if (S) { leaveQuestion(); save(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
});
</script>
</body>
</html>
